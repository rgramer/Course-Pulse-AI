openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: CoursePulse AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: reflections
    description: Student reflection operations
  - name: course-context
    description: Course context operations
  - name: faculty
    description: Faculty operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /topics:
    get:
      operationId: listTopics
      tags: [course-context]
      summary: List distinct topics for student form dropdowns
      responses:
        "200":
          description: List of topic strings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /course-contexts:
    get:
      operationId: listCourseContexts
      tags: [course-context]
      summary: List all course context records
      responses:
        "200":
          description: Array of course context records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseContext"
    post:
      operationId: createCourseContext
      tags: [course-context]
      summary: Create a new course context record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseContextInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseContext"

  /course-contexts/{id}:
    patch:
      operationId: updateCourseContext
      tags: [course-context]
      summary: Update a course context record
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseContextUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseContext"
        "404":
          description: Not found
    delete:
      operationId: deleteCourseContext
      tags: [course-context]
      summary: Delete a course context record
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /reflections:
    post:
      operationId: submitReflection
      tags: [reflections]
      summary: Submit a student reflection (auto-classifies)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReflectionInput"
      responses:
        "201":
          description: Submitted and classified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflectionWithSignal"

  /faculty/verify:
    post:
      operationId: verifyFacultyAccess
      tags: [faculty]
      summary: Verify faculty access code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacultyVerifyInput"
      responses:
        "200":
          description: Access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacultyVerifyResponse"
        "401":
          description: Invalid access code

  /faculty/dashboard:
    get:
      operationId: getFacultyDashboard
      tags: [faculty]
      summary: Get aggregated dashboard statistics with optional filters
      parameters:
        - in: query
          name: week
          required: false
          schema:
            type: integer
          description: Filter by specific week number
        - in: query
          name: topic
          required: false
          schema:
            type: string
          description: Filter by topic name
        - in: query
          name: signal
          required: false
          schema:
            type: string
          description: Filter by primary signal category
      responses:
        "200":
          description: Aggregated dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /faculty/actions:
    get:
      operationId: listFacultyActions
      tags: [faculty]
      summary: List all faculty instructional actions
      responses:
        "200":
          description: Array of faculty actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FacultyAction"
    post:
      operationId: createFacultyAction
      tags: [faculty]
      summary: Record a new faculty instructional action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacultyActionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacultyAction"

  /faculty/signals:
    get:
      operationId: listSignals
      tags: [faculty]
      summary: List all classified signals with reflection context
      responses:
        "200":
          description: Array of classified signals with reflection data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignalWithContext"

  /faculty/report:
    get:
      operationId: getFacultyReport
      tags: [faculty]
      summary: Get a full Course Learning Intelligence Report
      responses:
        "200":
          description: Course-wide learning intelligence report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseReport"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    CourseContext:
      type: object
      required: [id, week, topic, learningObjective, assignment, reading]
      properties:
        id:
          type: integer
        week:
          type: integer
        topic:
          type: string
        learningObjective:
          type: string
        assignment:
          type: ["string", "null"]
        reading:
          type: ["string", "null"]

    CourseContextInput:
      type: object
      required: [week, topic, learningObjective]
      properties:
        week:
          type: integer
        topic:
          type: string
        learningObjective:
          type: string
        assignment:
          type: string
        reading:
          type: string

    CourseContextUpdate:
      type: object
      properties:
        week:
          type: integer
        topic:
          type: string
        learningObjective:
          type: string
        assignment:
          type: string
        reading:
          type: string

    Reflection:
      type: object
      required: [id, week, topic, learningObjective, confidenceScore, reflectionText, supportRequested, createdAt]
      properties:
        id:
          type: integer
        week:
          type: integer
        topic:
          type: string
        learningObjective:
          type: string
        confidenceScore:
          type: integer
        reflectionText:
          type: string
        supportRequested:
          type: boolean
        createdAt:
          type: string

    ReflectionInput:
      type: object
      required: [week, topic, learningObjective, confidenceScore, reflectionText, supportRequested, consentGiven]
      properties:
        week:
          type: integer
        topic:
          type: string
        learningObjective:
          type: string
        confidenceScore:
          type: integer
        reflectionText:
          type: string
        supportRequested:
          type: boolean
        consentGiven:
          type: boolean

    ClassifiedSignal:
      type: object
      required: [id, reflectionId, primarySignal, secondarySignal, severityScore, themeSummary, recommendedAction]
      properties:
        id:
          type: integer
        reflectionId:
          type: integer
        primarySignal:
          type: string
        secondarySignal:
          type: ["string", "null"]
        severityScore:
          type: integer
        themeSummary:
          type: string
        recommendedAction:
          type: string

    ReflectionWithSignal:
      type: object
      required: [reflection, signal]
      properties:
        reflection:
          $ref: "#/components/schemas/Reflection"
        signal:
          $ref: "#/components/schemas/ClassifiedSignal"

    SignalWithContext:
      type: object
      required: [id, reflectionId, primarySignal, secondarySignal, severityScore, themeSummary, recommendedAction, week, topic, learningObjective]
      properties:
        id:
          type: integer
        reflectionId:
          type: integer
        primarySignal:
          type: string
        secondarySignal:
          type: ["string", "null"]
        severityScore:
          type: integer
        themeSummary:
          type: string
        recommendedAction:
          type: string
        week:
          type: integer
        topic:
          type: string
        learningObjective:
          type: string

    FacultyAction:
      type: object
      required: [id, week, topic, actionTaken, reason, createdAt]
      properties:
        id:
          type: integer
        week:
          type: integer
        topic:
          type: string
        actionTaken:
          type: string
        reason:
          type: ["string", "null"]
        createdAt:
          type: string

    FacultyActionInput:
      type: object
      required: [week, topic, actionTaken]
      properties:
        week:
          type: integer
        topic:
          type: string
        actionTaken:
          type: string
        reason:
          type: string

    FacultyVerifyInput:
      type: object
      required: [accessCode]
      properties:
        accessCode:
          type: string

    FacultyVerifyResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    SignalCount:
      type: object
      required: [signal, count]
      properties:
        signal:
          type: string
        count:
          type: integer

    TopicConfusionItem:
      type: object
      required: [topic, avgSeverity, count, mostCommonSignal]
      properties:
        topic:
          type: string
        avgSeverity:
          type: number
        count:
          type: integer
        mostCommonSignal:
          type: string

    ConfidenceTrendItem:
      type: object
      required: [week, avgConfidence, reflectionCount]
      properties:
        week:
          type: integer
        avgConfidence:
          type: number
        reflectionCount:
          type: integer

    RecommendedAdjustment:
      type: object
      required: [pattern, action, rationale, topic, learningObjective]
      properties:
        pattern:
          type: string
        action:
          type: string
        rationale:
          type: string
        topic:
          type: string
        learningObjective:
          type: string

    WeeklyPulse:
      type: object
      required: [avgConfidence, mostCommonSignal, highestConcernTopic, facultyPriority, insufficientData]
      properties:
        avgConfidence:
          type: number
        mostCommonSignal:
          type: string
        highestConcernTopic:
          type: ["string", "null"]
        facultyPriority:
          type: string
        insufficientData:
          type: boolean

    DashboardStats:
      type: object
      required: [totalReflections, avgConfidenceScore, mostCommonSignal, highestConcernTopic, percentRequestingSupport, avgSeverity, totalInstructionalActions, signalDistribution, topicConfusion, confidenceTrend, topConfusionThemes, recommendedAdjustments, weeklyPulse, insufficientData]
      properties:
        totalReflections:
          type: integer
        avgConfidenceScore:
          type: number
        mostCommonSignal:
          type: string
        highestConcernTopic:
          type: ["string", "null"]
        percentRequestingSupport:
          type: number
        avgSeverity:
          type: number
        totalInstructionalActions:
          type: integer
        signalDistribution:
          type: array
          items:
            $ref: "#/components/schemas/SignalCount"
        topicConfusion:
          type: array
          items:
            $ref: "#/components/schemas/TopicConfusionItem"
        confidenceTrend:
          type: array
          items:
            $ref: "#/components/schemas/ConfidenceTrendItem"
        topConfusionThemes:
          type: array
          items:
            type: string
        recommendedAdjustments:
          type: array
          items:
            $ref: "#/components/schemas/RecommendedAdjustment"
        weeklyPulse:
          $ref: "#/components/schemas/WeeklyPulse"
        insufficientData:
          type: boolean

    ImpactComparison:
      type: object
      required: [topic, week, actionTaken, beforePct, afterPct, signal, improvement]
      properties:
        topic:
          type: string
        week:
          type: integer
        actionTaken:
          type: string
        signal:
          type: string
        beforePct:
          type: number
        afterPct:
          type: number
        improvement:
          type: number

    ReportTopicSummary:
      type: object
      required: [topic, avgSeverity, count, dominantSignal, engagementLevel]
      properties:
        topic:
          type: string
        avgSeverity:
          type: number
        count:
          type: integer
        dominantSignal:
          type: string
        engagementLevel:
          type: string

    CourseReport:
      type: object
      required: [generatedAt, totalReflections, avgConfidence, supportRate, mostConfusingTopics, highestEngagementTopics, confidenceTrendSummary, supportNeedsSummary, instructionalActionsRecorded, impactComparisons, responsibleAiNote]
      properties:
        generatedAt:
          type: string
        totalReflections:
          type: integer
        avgConfidence:
          type: number
        supportRate:
          type: number
        mostConfusingTopics:
          type: array
          items:
            $ref: "#/components/schemas/ReportTopicSummary"
        highestEngagementTopics:
          type: array
          items:
            $ref: "#/components/schemas/ReportTopicSummary"
        confidenceTrendSummary:
          type: string
        supportNeedsSummary:
          type: string
        instructionalActionsRecorded:
          type: array
          items:
            $ref: "#/components/schemas/FacultyAction"
        impactComparisons:
          type: array
          items:
            $ref: "#/components/schemas/ImpactComparison"
        responsibleAiNote:
          type: string
